name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets the site be redeployed from the Actions tab without a commit —
  # needed after changing the Pages source, which does not republish itself.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Publish an explicit list rather than the whole repo, so working files
      # (PRD.md, Design.md, CLAUDE.md, uploads/, scraps/) are never served.
      # A file missing here 404s loudly; a denylist would leak new docs quietly.
      - name: Stage site files
        run: |
          mkdir -p _site
          cp index.html privacy.html robots.txt sitemap.xml .nojekyll _site/
          cp -r assets _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
          # Search-engine ownership files, if any are ever added at the root.
          find . -maxdepth 1 \( -name 'google*.html' -o -name 'BingSiteAuth.xml' \) \
            -exec cp {} _site/ \;
          find _site -type f | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
